<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B3D1E"/>
      <stop offset="50%" style="stop-color:#145A32"/>
      <stop offset="100%" style="stop-color:#27AE60"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#F0D060"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="20%" r="50%">
      <stop offset="0%" style="stop-color:#58D68D;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0B3D1E;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0B3D1E;stop-opacity:0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg1)"/>
  <rect width="400" height="560" fill="url(#glow1)"/>
  <rect width="400" height="560" fill="url(#glow2)"/>

  <!-- Geometric decorations -->
  <circle cx="340" cy="60" r="120" fill="none" stroke="#27AE60" stroke-width="0.5" opacity="0.3"/>
  <circle cx="340" cy="60" r="80" fill="none" stroke="#27AE60" stroke-width="0.5" opacity="0.2"/>
  <circle cx="60" cy="500" r="100" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="180" x2="400" y2="180" stroke="#27AE60" stroke-width="0.4" opacity="0.2"/>
  <line x1="0" y1="400" x2="400" y2="400" stroke="#27AE60" stroke-width="0.4" opacity="0.15"/>

  <!-- Top gold bar -->
  <rect x="0" y="0" width="400" height="6" fill="url(#gold1)"/>

  <!-- Mosque icon area -->
  <g transform="translate(200, 140)" filter="url(#shadow)">
    <!-- Dome -->
    <ellipse cx="0" cy="0" rx="55" ry="45" fill="#27AE60" opacity="0.9"/>
    <ellipse cx="0" cy="-5" rx="45" ry="38" fill="#1E8449"/>
    <!-- Crescent -->
    <circle cx="0" cy="-30" r="14" fill="#D4AF37"/>
    <circle cx="8" cy="-33" r="11" fill="#1E8449"/>
    <!-- Star -->
    <polygon points="0,-48 2,-43 7,-43 3,-40 5,-35 0,-38 -5,-35 -3,-40 -7,-43 -2,-43" fill="#D4AF37"/>
    <!-- Minaret left -->
    <rect x="-70" y="-20" width="18" height="50" rx="3" fill="#1A5C32"/>
    <rect x="-75" y="-28" width="28" height="12" rx="3" fill="#27AE60"/>
    <ellipse cx="-61" cy="-28" rx="8" ry="14" fill="#1A5C32"/>
    <!-- Minaret right -->
    <rect x="52" y="-20" width="18" height="50" rx="3" fill="#1A5C32"/>
    <rect x="47" y="-28" width="28" height="12" rx="3" fill="#27AE60"/>
    <ellipse cx="61" cy="-28" rx="8" ry="14" fill="#1A5C32"/>
    <!-- Base -->
    <rect x="-80" y="30" width="160" height="8" rx="2" fill="#0D4A20"/>
  </g>

  <!-- Gold separator -->
  <rect x="40" y="220" width="320" height="2" fill="url(#gold1)" rx="1"/>

  <!-- FREE badge -->
  <rect x="30" y="30" width="80" height="28" rx="14" fill="url(#gold1)"/>
  <text x="70" y="49" font-family="Arial Black" font-size="12" font-weight="900" fill="#0B3D1E" text-anchor="middle" letter-spacing="1">FREE</text>

  <!-- Main Title -->
  <text x="200" y="270" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="0.5">Passive Income</text>
  <text x="200" y="304" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="0.5">Blueprint</text>

  <!-- Subtitle -->
  <text x="200" y="340" font-family="Arial" font-size="14" fill="#A9DFBF" text-anchor="middle">for Young Muslims</text>

  <!-- Gold line -->
  <rect x="80" y="358" width="240" height="1.5" fill="url(#gold1)" rx="1"/>

  <!-- Description -->
  <text x="200" y="385" font-family="Arial" font-size="11" fill="#7CB98A" text-anchor="middle">Build Halal Wealth While You Sleep</text>
  <text x="200" y="402" font-family="Arial" font-size="11" fill="#7CB98A" text-anchor="middle">2026 Edition</text>

  <!-- Bottom section -->
  <rect x="0" y="480" width="400" height="80" fill="#071A0E" opacity="0.8"/>
  <rect x="0" y="480" width="400" height="2" fill="url(#gold1)"/>

  <!-- Author -->
  <text x="200" y="510" font-family="Arial" font-size="10" fill="#7CB98A" text-anchor="middle" letter-spacing="2">BY</text>
  <text x="200" y="532" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="url(#gold1)" text-anchor="middle" letter-spacing="1">UMAIR TAHIR</text>
  <text x="200" y="550" font-family="Arial" font-size="9" fill="#3D6B4E" text-anchor="middle" letter-spacing="1">MoneyCompounding.com</text>

  <!-- Bottom gold bar -->
  <rect x="0" y="554" width="400" height="6" fill="url(#gold1)"/>
</svg>
