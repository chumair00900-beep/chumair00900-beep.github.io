<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071A0E"/>
      <stop offset="50%" style="stop-color:#0B3D1E"/>
      <stop offset="100%" style="stop-color:#145A32"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#F0D060"/>
    </linearGradient>
    <linearGradient id="greenLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27AE60"/>
      <stop offset="100%" style="stop-color:#58D68D"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#071A0E;stop-opacity:0"/>
    </radialGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg2)"/>
  <rect width="400" height="560" fill="url(#centerGlow)"/>

  <!-- Grid lines background -->
  <g opacity="0.07" stroke="#27AE60" stroke-width="0.5">
    <line x1="0" y1="56" x2="400" y2="56"/>
    <line x1="0" y1="112" x2="400" y2="112"/>
    <line x1="0" y1="168" x2="400" y2="168"/>
    <line x1="0" y1="224" x2="400" y2="224"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="0" y1="336" x2="400" y2="336"/>
    <line x1="0" y1="392" x2="400" y2="392"/>
    <line x1="0" y1="448" x2="400" y2="448"/>
    <line x1="80" y1="0" x2="80" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="560"/>
    <line x1="240" y1="0" x2="240" y2="560"/>
    <line x1="320" y1="0" x2="320" y2="560"/>
  </g>

  <!-- Top gold bar -->
  <rect x="0" y="0" width="400" height="5" fill="url(#gold2)"/>

  <!-- Chart graphic -->
  <g transform="translate(50, 100)" filter="url(#shadow2)">
    <!-- Chart background -->
    <rect x="0" y="0" width="300" height="180" rx="12" fill="#0D2E18" opacity="0.8"/>
    <rect x="0" y="0" width="300" height="180" rx="12" fill="none" stroke="#27AE60" stroke-width="1" opacity="0.3"/>

    <!-- Chart bars -->
    <rect x="20" y="120" width="35" height="45" rx="4" fill="#1E8449" opacity="0.7"/>
    <rect x="70" y="95" width="35" height="70" rx="4" fill="#27AE60" opacity="0.8"/>
    <rect x="120" y="70" width="35" height="95" rx="4" fill="#2ECC71" opacity="0.85"/>
    <rect x="170" y="40" width="35" height="125" rx="4" fill="#58D68D" opacity="0.9"/>
    <rect x="220" y="15" width="35" height="150" rx="4" fill="url(#gold2)" opacity="0.95"/>

    <!-- Chart line -->
    <polyline points="37,118 87,93 137,68 187,38 237,13" fill="none" stroke="url(#gold2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dots on line -->
    <circle cx="37" cy="118" r="4" fill="#D4AF37"/>
    <circle cx="87" cy="93" r="4" fill="#D4AF37"/>
    <circle cx="137" cy="68" r="4" fill="#D4AF37"/>
    <circle cx="187" cy="38" r="4" fill="#D4AF37"/>
    <circle cx="237" cy="13" r="5" fill="#F0D060"/>

    <!-- Arrow up -->
    <polygon points="237,0 247,16 227,16" fill="#F0D060"/>

    <!-- X-axis labels -->
    <text x="37" y="172" font-family="Arial" font-size="8" fill="#7CB98A" text-anchor="middle">Yr1</text>
    <text x="87" y="172" font-family="Arial" font-size="8" fill="#7CB98A" text-anchor="middle">Yr5</text>
    <text x="137" y="172" font-family="Arial" font-size="8" fill="#7CB98A" text-anchor="middle">Yr10</text>
    <text x="187" y="172" font-family="Arial" font-size="8" fill="#7CB98A" text-anchor="middle">Yr20</text>
    <text x="237" y="172" font-family="Arial" font-size="8" fill="#D4AF37" text-anchor="middle" font-weight="bold">Yr30</text>
  </g>

  <!-- FREE badge -->
  <rect x="30" y="30" width="80" height="28" rx="14" fill="url(#gold2)"/>
  <text x="70" y="49" font-family="Arial Black" font-size="12" font-weight="900" fill="#071A0E" text-anchor="middle" letter-spacing="1">FREE</text>

  <!-- 2026 badge top right -->
  <rect x="290" y="30" width="80" height="28" rx="14" fill="none" stroke="#27AE60" stroke-width="1.5"/>
  <text x="330" y="49" font-family="Arial" font-size="11" fill="#58D68D" text-anchor="middle" letter-spacing="1">2026</text>

  <!-- Gold separator -->
  <rect x="40" y="300" width="320" height="2" fill="url(#gold2)" rx="1"/>

  <!-- Dollar sign big -->
  <text x="200" y="295" font-family="Georgia, serif" font-size="28" fill="#27AE60" text-anchor="middle" opacity="0.15" font-weight="bold">$$$</text>

  <!-- Main Title -->
  <text x="200" y="340" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="0.5">Money</text>
  <text x="200" y="375" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="url(#gold2)" text-anchor="middle" letter-spacing="0.5">Compounding</text>
  <text x="200" y="408" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">Guide</text>

  <!-- Gold line -->
  <rect x="80" y="422" width="240" height="1.5" fill="url(#greenLine)" rx="1"/>

  <!-- Stats row -->
  <text x="110" y="450" font-family="Arial Black" font-size="14" fill="url(#gold2)" text-anchor="middle">10x</text>
  <text x="200" y="450" font-family="Arial Black" font-size="14" fill="url(#gold2)" text-anchor="middle">12%</text>
  <text x="290" y="450" font-family="Arial Black" font-size="14" fill="url(#gold2)" text-anchor="middle">30yr</text>
  <text x="110" y="464" font-family="Arial" font-size="9" fill="#7CB98A" text-anchor="middle">Returns</text>
  <text x="200" y="464" font-family="Arial" font-size="9" fill="#7CB98A" text-anchor="middle">Avg/Year</text>
  <text x="290" y="464" font-family="Arial" font-size="9" fill="#7CB98A" text-anchor="middle">Horizon</text>

  <!-- Bottom section -->
  <rect x="0" y="480" width="400" height="80" fill="#040F07" opacity="0.9"/>
  <rect x="0" y="480" width="400" height="2" fill="url(#gold2)"/>

  <!-- Author -->
  <text x="200" y="510" font-family="Arial" font-size="10" fill="#7CB98A" text-anchor="middle" letter-spacing="2">BY</text>
  <text x="200" y="532" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="url(#gold2)" text-anchor="middle" letter-spacing="1">UMAIR TAHIR</text>
  <text x="200" y="550" font-family="Arial" font-size="9" fill="#3D6B4E" text-anchor="middle" letter-spacing="1">MoneyCompounding.com</text>

  <!-- Bottom gold bar -->
  <rect x="0" y="554" width="400" height="6" fill="url(#gold2)"/>
</svg>
